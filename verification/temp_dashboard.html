<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <script>
    // Global State
    let dashboardData = null;

    function loadDashboard() {
      const email = localStorage.getItem('user_email'); // Assumes set during Login
      if (!email) {
        window.location.href = '<?= getScriptUrl() ?>?page=login_student';
        return;
      }

      google.script.run
        .withSuccessHandler(renderDashboard)
        .withFailureHandler(err => alert('Error loading dashboard: ' + err))
        .getStudentDashboardData(email);
    }

    function renderDashboard(data) {
      dashboardData = data;
      const p = data.profile;

      // Profile Widget
      document.getElementById('profile-name').innerText = p.name;
      document.getElementById('profile-id').innerText = p.student_id;
      document.getElementById('profile-level').innerText = 'Mustawa ' + p.current_mustawa;
      document.getElementById('profile-status').innerText = p.status;

      // Academic History
      const historyHtml = data.academic_history.map(h => `
        <div class="flex items-center justify-between p-3 mb-2 bg-gray-50 rounded">
          <span class="font-medium text-gray-700">Mustawa ${h.level}</span>
          <span class="px-2 py-1 text-xs rounded ${getStatusColor(h.status)}">${h.status}</span>
        </div>
      `).join('');
      document.getElementById('academic-history-list').innerHTML = historyHtml;

      // Active Courses
      if (data.active_courses.length === 0) {
        document.getElementById('active-courses-list').innerHTML = '<p class="text-gray-500 italic">Tidak ada mata kuliah aktif.</p>';
      } else {
        const activeHtml = data.active_courses.map(c => `
          <div class="bg-white border rounded-lg shadow-sm p-4 hover:shadow-md transition">
            <h3 class="font-bold text-lg text-blue-900">${c.name}</h3>
            <p class="text-sm text-gray-600 mb-4">${c.semester_period} | ${c.sks} SKS</p>
            <a href="<?= getScriptUrl() ?>?page=course_room&course_id=${c.course_id}"
               class="block text-center bg-blue-600 text-white py-2 rounded hover:bg-blue-700">
               Masuk Kelas
            </a>
          </div>
        `).join('');
        document.getElementById('active-courses-list').innerHTML = activeHtml;
      }

      // Available Courses (Enrollment)
      if (data.available_courses.length === 0) {
        document.getElementById('available-courses-section').classList.add('hidden');
      } else {
        const availHtml = data.available_courses.map(c => `
           <div class="flex justify-between items-center p-3 border-b">
             <div>
               <div class="font-semibold">${c.name}</div>
               <div class="text-xs text-gray-500">${c.sks} SKS</div>
             </div>
             <button onclick="enroll('${c.course_id}')" class="bg-green-600 text-white px-3 py-1 rounded text-sm">Ambil</button>
           </div>
        `).join('');
        document.getElementById('available-courses-list').innerHTML = availHtml;
      }

      document.getElementById('loading').classList.add('hidden');
      document.getElementById('main-content').classList.remove('hidden');
    }

    function getStatusColor(status) {
      if (status === 'PASSED') return 'bg-green-100 text-green-800';
      if (status === 'ACTIVE') return 'bg-blue-100 text-blue-800';
      if (status === 'FAILED') return 'bg-red-100 text-red-800';
      return 'bg-gray-100 text-gray-600'; // Locked
    }

    function enroll(courseId) {
      if(confirm('Ambil mata kuliah ini?')) {
        // Implementation for enrollment would go here
        alert('Fitur pendaftaran akan segera hadir.');
      }
    }

    function logout() {
      localStorage.removeItem('user_email');
      window.location.href = '<?= getScriptUrl() ?>?page=login_student';
    }

    window.onload = loadDashboard;
  </script>

<body class="bg-gray-100 min-h-screen">

        <!-- Academic History Widget -->

      </div>

      <!-- Right Column: Active Courses -->

        <!-- Active Courses -->

        <!-- Available Courses (Next Semester) -->
