<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff Login - Diploma Ilmi</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: { staff: { primary: '#1e40af', dark: '#1e3a8a', light: '#dbeafe' } }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        .bg-pattern { background-color: #f1f5f9; background-image: radial-gradient(#cbd5e1 1px, transparent 1px); background-size: 20px 20px; }
    </style>
</head>
<body class="font-sans text-slate-800 bg-slate-50 h-screen flex items-center justify-center bg-pattern">

    <div class="w-full max-w-5xl bg-white rounded-2xl shadow-2xl overflow-hidden flex flex-col md:flex-row h-full md:h-[600px] m-4">

        <!-- KOLOM KIRI: INFO -->
        <div class="w-full md:w-1/2 bg-gradient-to-br from-slate-800 to-slate-900 p-10 flex flex-col justify-between text-white relative overflow-hidden">
            <div class="absolute top-0 right-0 -mr-20 -mt-20 w-80 h-80 rounded-full bg-blue-500 opacity-10 blur-3xl"></div>
            <div class="relative z-10">
                <div class="flex items-center gap-3 mb-8">
                    <img src="https://diplomailmi.my.id/wp-content/uploads/2025/09/Logo-Iploma-Ilmi-Polos.png" style="height: 50px; width: auto;">
                    <div class="border-l border-slate-600 pl-3">
                        <h1 class="text-lg font-bold leading-none text-white">DIPLOMA ILMI</h1>
                        <p class="text-[10px] text-slate-400 tracking-wider">STAFF PORTAL</p>
                    </div>
                </div>
                <h2 class="text-3xl font-bold mb-4 text-white">Sistem Informasi<br>Manajemen Terpadu</h2>
                <p class="text-slate-300 text-sm leading-relaxed mb-8">Portal khusus Dosen dan Staff.</p>
            </div>
            <div class="relative z-10 text-xs text-slate-500 mt-8">&copy; 2025 Yayasan Madinah Salam.</div>
        </div>

        <!-- KOLOM KANAN: FORM -->
        <div class="w-full md:w-1/2 p-10 flex flex-col justify-center bg-white relative">
            <div class="mb-8">
                <h3 class="text-2xl font-bold text-slate-800">Login Pegawai</h3>
            </div>
            <div id="login-error" class="hidden mb-4 bg-red-50 border-l-4 border-red-500 p-3 rounded-r text-sm text-red-700 flex items-center gap-2">
                <i class="fa-solid fa-circle-exclamation"></i><span id="error-text">Kredensial tidak valid.</span>
            </div>

            <form onsubmit="handleStaffLogin(event)" class="space-y-6">
                <div class="group">
                    <label class="block text-xs font-bold text-slate-600 uppercase mb-2">Role</label>
                    <select id="staff-role" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:border-staff-primary outline-none text-sm">
                        <option value="Staff Akademik">Staff Akademik</option>
                        <option value="Staff Keuangan">Staff Keuangan</option>
                        <option value="Staff Kesiswaan">Staff Kesiswaan</option>
                        <option value="Dosen">Dosen</option>
                        <option value="Super Admin">Super Admin</option>
                    </select>
                </div>
                <div class="group">
                    <label class="block text-xs font-bold text-slate-600 uppercase mb-2">ID Pegawai / Email</label>
                    <input type="text" id="staff-id" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:border-staff-primary outline-none text-sm" placeholder="NIP atau Email Resmi">
                </div>
                <div class="group">
                    <label class="block text-xs font-bold text-slate-600 uppercase mb-2">Kata Sandi</label>
                    <input type="password" id="staff-pass" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:border-staff-primary outline-none text-sm" placeholder="••••••••">
                </div>

                <button type="submit" id="btn-login" class="w-full bg-blue-700 hover:bg-blue-800 text-white font-bold py-3.5 rounded-xl shadow-lg shadow-blue-200 transition transform active:scale-95 flex justify-center items-center gap-2 mt-2">
                    <span id="btn-text">Masuk Dashboard</span>
                </button>
            </form>
        </div>
    </div>

    <script>
        const GAS_WEB_APP_URL = 'YOUR_GAS_WEB_APP_URL';
        const REDIRECT_MAP = {
            'Super Admin': '/dashboard-superadmin',
            'Dosen': '/dashboard-dosen',
            'Staff Keuangan': '/dashboard-keuangan',
            'Staff Akademik': '/dashboard-akademik',
            'Staff Kesiswaan': '/dashboard-kesiswaan'
        };

        function handleStaffLogin(e) {
            e.preventDefault();
            const id = document.getElementById('staff-id').value;
            const pass = document.getElementById('staff-pass').value;
            const role = document.getElementById('staff-role').value;
            const btn = document.getElementById('btn-login');
            const btnText = document.getElementById('btn-text');
            const errorBox = document.getElementById('login-error');
            const errorText = document.getElementById('error-text');

            errorBox.classList.add('hidden');
            btn.disabled = true;
            btnText.innerText = 'Memverifikasi...';

            const payload = {
                action: 'login',
                identifier: id,
                password: pass,
                role: role
            };

            fetch(GAS_WEB_APP_URL, {
                method: "POST",
                body: JSON.stringify(payload)
            })
            .then(r => r.json())
            .then(result => {
                if (result.success) {
                    if (result.user.role === 'Mahasiswa') {
                        throw new Error("Akun Mahasiswa tidak diizinkan di sini.");
                    }
                    localStorage.setItem('lms_user', JSON.stringify(result.user));
                    window.location.href = REDIRECT_MAP[role] || '/';
                } else {
                    throw new Error(result.message);
                }
            })
            .catch(error => {
                errorBox.classList.remove('hidden');
                errorText.innerText = error.message;
                btn.disabled = false;
                btnText.innerText = 'Masuk Dashboard';
            });
        }
    </script>

    <div class="mt-12 mb-8 flex flex-wrap justify-center items-center gap-x-2 text-[9px] font-bold text-slate-400 uppercase tracking-widest">
        <span>© 2025</span>
        <a href="https://www.instagram.com/ar.gumelar/" target="_blank" class="credit-link text-slate-600">ar.gumelar</a>
        <span class="text-slate-200">&</span>
        <a href="https://www.instagram.com/sentiliun" target="_blank" class="credit-link text-slate-600">Sentiliun</a>
        <span class="text-slate-200 mx-1">|</span>
        <span class="font-medium text-slate-400">Licensed for exclusive use by</span>
        <span class="text-slate-900 font-black">Diploma Ilmi</span>
    </div>
</body>
</html>
