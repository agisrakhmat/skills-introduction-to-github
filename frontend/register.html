<!--
  WIDGET PENDAFTARAN MAHASISWA BARU
  Cara Pasang di Elementor:
  1. Drag widget "HTML" ke halaman.
  2. Paste kode ini.
  3. GANTI 'YOUR_GAS_WEB_APP_URL' dengan URL Google Apps Script Anda (setelah deploy).
-->

<div class="lms-register-container">
  <h3>Pendaftaran Mahasiswa Baru</h3>
  <form id="regForm">
    <div class="form-group">
      <label>Nama Lengkap</label>
      <input type="text" id="regNama" required>
    </div>

    <div class="form-group">
      <label>Email</label>
      <input type="email" id="regEmail" required>
    </div>

    <div class="form-group">
      <label>No WhatsApp (Format: 0812...)</label>
      <input type="text" id="regWA" required pattern="[0-9]+">
      <small>Password akun Anda adalah 4 digit terakhir nomor ini.</small>
    </div>

    <div class="form-group">
      <label>Jenis Kelamin</label>
      <select id="regGender">
        <option value="Laki-laki">Laki-laki</option>
        <option value="Perempuan">Perempuan</option>
      </select>
    </div>

    <!-- Hidden Fields (Bisa diubah jika perlu) -->
    <input type="hidden" id="regStatus" value="RGR"> <!-- Reguler -->
    <input type="hidden" id="regAngkatan" value="07">

    <button type="submit" id="btnReg">Daftar Sekarang</button>
  </form>

  <div id="regMessage" style="margin-top:10px;"></div>

  <!-- Area Hasil Pendaftaran -->
  <div id="regResult" style="display:none; margin-top:20px; border:1px solid green; padding:10px; background:#f0fff4;">
    <h4>Pendaftaran Berhasil!</h4>
    <p>Silakan simpan data login Anda:</p>
    <ul>
      <li><strong>NIM:</strong> <span id="resNIM"></span></li>
      <li><strong>Password:</strong> <span id="resPass"></span></li>
    </ul>
    <a href="/login" style="display:block; text-align:center; background:#28a745; color:white; padding:10px; text-decoration:none;">Ke Halaman Login</a>
  </div>
</div>

<style>
  .lms-register-container {
    max-width: 500px;
    margin: 0 auto;
    padding: 20px;
    border: 1px solid #ddd;
    border-radius: 8px;
    background: #fff;
    font-family: sans-serif;
  }
  .form-group { margin-bottom: 15px; }
  .form-group label { display: block; margin-bottom: 5px; font-weight: bold; }
  .form-group input, .form-group select {
    width: 100%; padding: 8px; box-sizing: border-box;
  }
  button {
    width: 100%; padding: 10px; background: #007bff; color: white; border: none; cursor: pointer;
  }
  button:hover { background: #0069d9; }
  .loading { opacity: 0.5; pointer-events: none; }
</style>

<script>
  // === KONFIGURASI ===
  const GAS_URL_REG = "YOUR_GAS_WEB_APP_URL"; // Ganti dengan URL Deploy GAS Anda

  document.getElementById('regForm').addEventListener('submit', function(e) {
    e.preventDefault();

    const btn = document.getElementById('btnReg');
    const msg = document.getElementById('regMessage');
    const resDiv = document.getElementById('regResult');

    // UI Loading
    btn.innerText = "Memproses Pendaftaran...";
    btn.classList.add('loading');
    msg.innerText = "";
    resDiv.style.display = "none";

    // Data
    const payload = {
      action: "register",
      Nama: document.getElementById('regNama').value,
      Email: document.getElementById('regEmail').value,
      NoWA: document.getElementById('regWA').value,
      Gender: document.getElementById('regGender').value,
      Status: document.getElementById('regStatus').value,
      AngkatanCode: document.getElementById('regAngkatan').value
    };

    fetch(GAS_URL_REG, {
      method: "POST",
      body: JSON.stringify(payload)
    })
    .then(response => response.json())
    .then(data => {
      btn.innerText = "Daftar Sekarang";
      btn.classList.remove('loading');

      if (data.success) {
        msg.innerText = "";
        // Tampilkan Hasil
        document.getElementById('resNIM').innerText = data.data.NIM;
        document.getElementById('resPass').innerText = data.data.Password;
        resDiv.style.display = "block";
        document.getElementById('regForm').reset();
      } else {
        msg.innerText = "Gagal: " + data.message;
        msg.style.color = "red";
      }
    })
    .catch(error => {
      console.error(error);
      btn.innerText = "Daftar Sekarang";
      btn.classList.remove('loading');
      msg.innerText = "Terjadi kesalahan koneksi.";
      msg.style.color = "red";
    });
  });
</script>
