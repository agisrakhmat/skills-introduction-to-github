<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <style>
      body {
        font-family: Arial, sans-serif;
        padding: 20px;
        background-color: #f4f7f6;
      }
      h2 {
        color: #333;
        border-bottom: 2px solid #28a745;
        padding-bottom: 10px;
      }
      .form-group {
        margin-bottom: 15px;
      }
      label {
        display: block;
        font-weight: bold;
        margin-bottom: 5px;
        color: #555;
      }
      select {
        width: 100%;
        padding: 10px;
        border: 1px solid #ccc;
        border-radius: 4px;
        box-sizing: border-box;
        font-size: 14px;
      }
      .btn {
        background-color: #28a745;
        color: white;
        padding: 10px 15px;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        font-size: 14px;
        font-weight: bold;
        width: 100%;
        margin-top: 10px;
      }
      .btn:hover {
        background-color: #218838;
      }
      .btn-danger {
        background-color: #dc3545;
        margin-top: 10px;
      }
      .btn-danger:hover {
        background-color: #c82333;
      }
      .info-box {
        background-color: #e9ecef;
        padding: 15px;
        border-radius: 5px;
        margin-bottom: 15px;
        color: #495057;
        font-size: 13px;
      }
      #status-message {
        margin-top: 15px;
        padding: 10px;
        border-radius: 4px;
        display: none;
      }
      .success {
        background-color: #d4edda;
        color: #155724;
        border: 1px solid #c3e6cb;
      }
      .error {
        background-color: #f8d7da;
        color: #721c24;
        border: 1px solid #f5c6cb;
      }
      .loader {
        border: 4px solid #f3f3f3;
        border-top: 4px solid #28a745;
        border-radius: 50%;
        width: 20px;
        height: 20px;
        animation: spin 1s linear infinite;
        display: none;
        margin: 10px auto;
      }
      .center {
        text-align: center;
      }
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <h2>Proses PDF Invoice</h2>

    <div class="info-box">
      Pilih nomor invoice di bawah ini yang belum memiliki file PDF. Sistem akan memproses dan menyimpannya di Google Drive dengan format A4 sesuai Template Sheet Anda.
    </div>

    <div id="loading-list" class="center">
      <div class="loader" style="display: inline-block;"></div>
      <p>Memuat daftar invoice...</p>
    </div>

    <form id="pdfForm" onsubmit="generatePdf(event)" style="display: none;">
      <div class="form-group">
        <label for="invoiceSelect">Pilih Invoice yang Belum Diproses:</label>
        <select id="invoiceSelect" name="invoiceSelect" required>
          <option value="" disabled selected>-- Pilih Invoice --</option>
        </select>
      </div>

      <div class="center">
        <button type="submit" class="btn" id="generateBtn">Proses Jadi PDF (A4)</button>
        <div id="process-loader" class="loader"></div>
        <button type="button" class="btn btn-danger" onclick="google.script.host.close()">Tutup</button>
      </div>
    </form>

    <div id="status-message"></div>

    <script>
      // Load pending invoices on startup
      window.onload = function() {
        google.script.run
          .withSuccessHandler(populateList)
          .withFailureHandler(showError)
          .getPendingPdfInvoices();
      };

      function populateList(invoices) {
        document.getElementById('loading-list').style.display = 'none';
        var form = document.getElementById('pdfForm');
        var select = document.getElementById('invoiceSelect');
        var msg = document.getElementById('status-message');

        if (!invoices || invoices.length === 0) {
          msg.style.display = 'block';
          msg.className = 'success';
          msg.innerHTML = 'Semua invoice sudah memiliki link PDF. Tidak ada yang perlu diproses.';
          return;
        }

        form.style.display = 'block';
        for (var i = 0; i < invoices.length; i++) {
          var option = document.createElement('option');
          option.value = invoices[i].noInvoice;
          option.text = invoices[i].noInvoice + " - " + invoices[i].klien;
          select.appendChild(option);
        }
      }

      function showError(error) {
        document.getElementById('loading-list').style.display = 'none';
        var msg = document.getElementById('status-message');
        msg.style.display = 'block';
        msg.className = 'error';
        msg.textContent = 'Gagal memuat daftar: ' + error.message;
      }

      function generatePdf(event) {
        event.preventDefault();

        var noInvoice = document.getElementById('invoiceSelect').value;
        if (!noInvoice) return;

        var btn = document.getElementById('generateBtn');
        var loader = document.getElementById('process-loader');
        var msg = document.getElementById('status-message');
        var select = document.getElementById('invoiceSelect');

        btn.disabled = true;
        select.disabled = true;
        loader.style.display = 'inline-block';
        msg.style.display = 'none';

        google.script.run
          .withSuccessHandler(function(response) {
            btn.disabled = false;
            select.disabled = false;
            loader.style.display = 'none';
            msg.style.display = 'block';

            if (response.success) {
              msg.className = 'success';
              msg.innerHTML = 'Berhasil! PDF disimpan: <a href="' + response.url + '" target="_blank">Buka PDF</a>';

              // Remove the processed option from the dropdown
              for (var i=0; i < select.options.length; i++) {
                if (select.options[i].value === noInvoice) {
                  select.remove(i);
                  break;
                }
              }
              select.value = "";

              if (select.options.length === 1) { // Only the disabled default option left
                document.getElementById('pdfForm').style.display = 'none';
                msg.innerHTML += '<br><br>Semua antrean invoice sudah selesai diproses.';
              }
            } else {
              msg.className = 'error';
              msg.textContent = 'Gagal memproses PDF: ' + response.message;
            }
          })
          .withFailureHandler(function(error) {
            btn.disabled = false;
            select.disabled = false;
            loader.style.display = 'none';
            msg.style.display = 'block';
            msg.className = 'error';
            msg.textContent = 'Terjadi kesalahan sistem: ' + error.message;
          })
          .processPdfGeneration(noInvoice);
      }
    </script>
  </body>
</html>
